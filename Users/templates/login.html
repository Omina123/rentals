<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Rental Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            background: #007bff;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        h3 {
            color: #333;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }

        /* Floating Label Custom Styling */
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #007bff;
            opacity: 0.8;
        }

        .form-control {
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: none;
        }

        .btn-login {
            background: #007bff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: #0056b3;
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3);
        }

        .forgot-link {
            text-decoration: none;
            color: #6c757d;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #007bff;
        }

        /* Animation for appearance */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translate3d(0, -20%, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .animate-in {
            animation: fadeInDown 0.6s ease-out;
        }
    </style>
</head>
<body>

<div class="login-card animate-in">
    <div class="brand-logo">
        <i class="fas fa-key"></i>
    </div>
    <h3>Welcome Back</h3>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" id="loginForm">
        {% csrf_token %}
        
        <div class="form-floating mb-3">
            <input type="text" name="username" class="form-control" id="floatingInput" placeholder="name@example.com or 254..." required>
            <label for="floatingInput">Email or Phone Number</label>
        </div>

        <div class="form-floating mb-3 position-relative">
            <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
            <label for="floatingPassword">Password</label>
            <span class="position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer" onclick="togglePass()" style="z-index: 10; cursor: pointer;">
                <i class="fas fa-eye text-muted" id="eyeIcon"></i>
            </span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-label" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.85rem;">Remember me</label>
            </div>
            <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-login" id="submitBtn">
            <span id="btnText">Sign In</span>
        </button>

        <div class="text-center mt-4">
            <p class="text-muted small">New to the platform? <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none">Create Account</a></p>
        </div>
    </form>
</div>

<script>
    // 1. Password Visibility Toggle
    function togglePass() {
        const passInput = document.getElementById('floatingPassword');
        const eyeIcon = document.getElementById('eyeIcon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passInput.type = 'password';
            eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // 2. Button Loading Effect
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    loginForm.addEventListener('submit', function() {
        submitBtn.disabled = true;
        btnText.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Authenticating...';
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
