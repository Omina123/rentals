<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Rental Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 600px;
            border: none;
        }

        .header-section {
            background: #007bff;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .form-section {
            padding: 40px;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ced4da;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25);
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .input-group-text {
            background-color: transparent;
            border-right: none;
        }

        .form-control {
            border-left: none;
        }

        .password-toggle {
            cursor: pointer;
            color: #6c757d;
        }

        @media (max-width: 576px) {
            .form-section { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="register-card animate__animated animate__fadeIn">
    <div class="header-section">
        <i class="fas fa-house-chimney-user fa-3x mb-3"></i>
        <h2>Create Account</h2>
        <p class="mb-0">Join our Rental Management Community</p>
    </div>

    <div class="form-section">
        <form method="POST" id="registerForm" class="needs-validation" novalidate>
            {% csrf_token %}

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control" placeholder="John" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control" placeholder="Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number (254...)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                    <input type="text" name="phone_number" id="phoneInput" class="form-control" placeholder="254712345678" required>
                </div>
                <small id="phoneHelp" class="text-muted"></small>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div><input type="password" name="password1" class="form-control" required>
                    </div>
                

                <div class="col-md-6 mb-4">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-check-double"></i></span>
                        <input type="password" name="password2" class="form-control" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary mb-3">
                <i class="fas fa-user-plus me-2"></i> Create Tenant Account
            </button>

            <div class="text-center mt-3">
                <span class="text-muted">Already have an account?</span>
                <a href="{% url 'Login' %}" class="text-primary fw-bold text-decoration-none"> Login here</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Password toggle for the first password field
    function togglePassword() {
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Phone validation
    const phoneInput = document.getElementById('phoneInput');
    const phoneHelp = document.getElementById('phoneHelp');
    
    phoneInput.addEventListener('input', function() {
        const pattern = /^2547\d{8}$/;
        if (pattern.test(this.value)) {
            phoneHelp.innerText = "Valid Kenyan format ✅";
            phoneHelp.className = "text-success";
            this.style.borderColor = "#198754";
        } else {
            phoneHelp.innerText = "Must start with 2547... (12 digits)";
            phoneHelp.className = "text-danger";
            this.style.borderColor = "#dc3545";
        }
    });

    // Form Loading State
    const form = document.getElementById('registerForm');
    form.addEventListener('submit', function(e) {
        if (!form.checkValidity()) {
            e.preventDefault();
            e.stopPropagation();
        } else {
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating Account...';
            btn.disabled = true;
        }
        form.classList.add('was-validated');
    });
</script>

</body>
</html>
